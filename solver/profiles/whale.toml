name = "Whale"
description = """
The recreational player who is there to gamble. Calls far too much, raises his draws, bets
into the raiser, and sizes his bets by hand strength (big = strong, small = not)."""

[[rules]]
note = "raises his draws"
streets = ["flop", "turn"]
facing = "bet"
hands = ["draw"]
set = { raise = 0.7, call = 0.3 }

[[rules]]
note = "otherwise just calls"
facing = "bet"
hands = ["strong", "medium", "weak", "air"]
scale = { raise = 0.3 }

[[rules]]
note = "size tell: big bet = big hand"
facing = "none"
hands = ["monster", "strong"]
scale = { bet_large = 3.0, bet_small = 0.5 }

[[rules]]
note = "size tell: small bet = weak or drawing"
facing = "none"
hands = ["medium", "weak", "draw", "air"]
scale = { bet_large = 0.2, bet_small = 1.5 }

[[rules]]
note = "calls a flop c-bet about half the time"
streets = ["flop"]
role = ["vs_cbet"]
scale = { fold = 0.772 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["vs_bet"]
scale = { fold = 0.725 }

[[rules]]
note = "calls turn bets more than anyone: folds 4 in 10"
streets = ["turn"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 0.729 }

[[rules]]
# calibration (fitted to real players)
streets = ["river"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 1.01 }

[[rules]]
# calibration (fitted to real players)
role = ["vs_cbet", "vs_bet"]
scale = { raise = 1.267 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["aggr"]
scale = { aggressive = 2.764 }

[[rules]]
# calibration (fitted to real players)
streets = ["turn", "river"]
role = ["aggr"]
scale = { aggressive = 2.33 }

[[rules]]
note = "bets into the preflop raiser about 1 flop in 5"
role = ["donk"]
scale = { aggressive = 6.072 }

[[rules]]
# calibration (fitted to real players)
role = ["free"]
scale = { aggressive = 1.931 }

[[rules]]
note = "about 1 in 5 of his called river bets is a bluff"
streets = ["river"]
facing = "none"
hands = ["weak", "air"]
scale = { aggressive = 0.799 }
