name = "Shark"
description = """
A strong human pro (the pros who played Pluribus): close to the baseline, a little more
aggressive and harder to push off a hand."""

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["vs_cbet"]
scale = { fold = 0.782 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["vs_bet"]
scale = { fold = 0.807 }

[[rules]]
# calibration (fitted to real players)
streets = ["turn"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 1.127 }

[[rules]]
# calibration (fitted to real players)
streets = ["river"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 1.872 }

[[rules]]
# calibration (fitted to real players)
role = ["vs_cbet", "vs_bet"]
scale = { raise = 1.328 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["aggr"]
scale = { aggressive = 1.111 }

[[rules]]
# calibration (fitted to real players)
streets = ["turn", "river"]
role = ["aggr"]
scale = { aggressive = 0.943 }

[[rules]]
# calibration (fitted to real players)
role = ["donk"]
scale = { aggressive = 0.723 }

[[rules]]
# calibration (fitted to real players)
role = ["free"]
scale = { aggressive = 0.918 }

[[rules]]
# calibration (fitted to real players)
streets = ["river"]
facing = "none"
hands = ["weak", "air"]
scale = { aggressive = 0.921 }
