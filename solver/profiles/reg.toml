name = "Reg"
description = """
A modern regular (tight-aggressive): raises first in, 3-bets more than the old-school reg,
c-bets often and folds when he meets resistance. Solid, but more predictable than an expert."""

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["vs_cbet"]
scale = { fold = 0.852 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["vs_bet"]
scale = { fold = 1.05 }

[[rules]]
note = "folds to turn and river bets more than most players"
streets = ["turn"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 1.406 }

[[rules]]
# calibration (fitted to real players)
streets = ["river"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 2.14 }

[[rules]]
# calibration (fitted to real players)
role = ["vs_cbet", "vs_bet"]
scale = { raise = 1.412 }

[[rules]]
note = "c-bets the flop 6 times in 10"
streets = ["flop"]
role = ["aggr"]
scale = { aggressive = 1.286 }

[[rules]]
# calibration (fitted to real players)
streets = ["turn", "river"]
role = ["aggr"]
scale = { aggressive = 0.974 }

[[rules]]
# calibration (fitted to real players)
role = ["donk"]
scale = { aggressive = 1.881 }

[[rules]]
# calibration (fitted to real players)
role = ["free"]
scale = { aggressive = 0.884 }

[[rules]]
note = "about 1 in 6 of his called river bets is a bluff"
streets = ["river"]
facing = "none"
hands = ["weak", "air"]
scale = { aggressive = 0.687 }
