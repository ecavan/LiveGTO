name = "Station"
description = """
Loose-passive calling station. Plays too many hands and calls a lot before the flop; after it he
folds a little less than most and checks hands he should bet. When he bets the river he usually
has it. The most common profitable opponent at $1/$2."""

[[rules]]
note = "hates folding a pair to a normal bet"
facing_size = ["small", "large"]
hands = ["strong", "medium", "weak"]
scale = { fold = 0.5 }

[[rules]]
note = "checks his medium hands"
facing = "none"
hands = ["medium"]
scale = { aggressive = 0.5 }

[[rules]]
note = "bets smaller than he should with value"
facing = "none"
hands = ["monster", "strong"]
scale = { bet_small = 1.5 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
facing = "bet"
scale = { fold = 1.008 }

[[rules]]
note = "folds to bets a little less than most players"
streets = ["turn"]
facing = "bet"
scale = { fold = 1.433 }

[[rules]]
# calibration (fitted to real players)
streets = ["river"]
facing = "bet"
scale = { fold = 2.602 }

[[rules]]
# calibration (fitted to real players)
facing = "bet"
scale = { raise = 1.735 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["aggr"]
scale = { aggressive = 1.429 }

[[rules]]
# calibration (fitted to real players)
streets = ["turn", "river"]
role = ["aggr"]
scale = { aggressive = 1.229 }

[[rules]]
note = "bets into the preflop raiser more than most (about 1 flop in 6)"
role = ["donk"]
scale = { aggressive = 5.346 }

[[rules]]
# calibration (fitted to real players)
role = ["free"]
scale = { aggressive = 1.161 }

[[rules]]
note = "does bluff the river sometimes: about 1 in 7 of his called river bets"
streets = ["river"]
facing = "none"
hands = ["weak", "air"]
scale = { aggressive = 0.585 }
