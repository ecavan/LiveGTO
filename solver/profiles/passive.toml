name = "Passive"
description = """
Tight-passive. Plays a normal number of hands but rarely raises: limps, calls, and folds
when he misses. When he bets or raises he has it."""

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["vs_cbet"]
scale = { fold = 0.96 }

[[rules]]
note = "folds to a donk bet or a stab 2 times in 3"
streets = ["flop"]
role = ["vs_bet"]
scale = { fold = 1.124 }

[[rules]]
note = "folds to turn bets half the time"
streets = ["turn"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 1.306 }

[[rules]]
# calibration (fitted to real players)
streets = ["river"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 1.627 }

[[rules]]
# calibration (fitted to real players)
role = ["vs_cbet", "vs_bet"]
scale = { raise = 1.495 }

[[rules]]
# calibration (fitted to real players)
role = ["vs_raise"]
scale = { fold = 1.124 }

[[rules]]
# calibration (fitted to real players)
role = ["vs_raise"]
scale = { raise = 1.137 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["aggr"]
scale = { aggressive = 1.271 }

[[rules]]
# calibration (fitted to real players)
streets = ["turn", "river"]
role = ["aggr"]
scale = { aggressive = 1.059 }

[[rules]]
# calibration (fitted to real players)
role = ["donk"]
scale = { aggressive = 4.221 }

[[rules]]
# calibration (fitted to real players)
role = ["free"]
scale = { aggressive = 0.811 }

[[rules]]
note = "seldom bluffs the river: about 1 in 10 called river bets"
streets = ["river"]
facing = "none"
hands = ["weak", "air"]
scale = { aggressive = 0.414 }
