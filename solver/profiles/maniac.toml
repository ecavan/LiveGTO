name = "Maniac"
description = """
Loose-aggressive to a fault. Bets and raises far too often, especially with air and draws,
and folds too little. Call him down lighter; let him bluff."""

[[rules]]
note = "bluffs big with nothing"
facing = "none"
hands = ["weak", "draw", "air"]
scale = { bet_large = 1.5 }

[[rules]]
note = "calls flop c-bets more than most players"
streets = ["flop"]
role = ["vs_cbet"]
scale = { fold = 0.768 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["vs_bet"]
scale = { fold = 0.851 }

[[rules]]
# calibration (fitted to real players)
streets = ["turn"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 0.866 }

[[rules]]
# calibration (fitted to real players)
streets = ["river"]
role = ["vs_cbet", "vs_bet"]
scale = { fold = 1.182 }

[[rules]]
# calibration (fitted to real players)
role = ["vs_cbet", "vs_bet"]
scale = { raise = 1.805 }

[[rules]]
# calibration (fitted to real players)
streets = ["flop"]
role = ["aggr"]
scale = { aggressive = 1.24 }

[[rules]]
# calibration (fitted to real players)
streets = ["turn", "river"]
role = ["aggr"]
scale = { aggressive = 1.071 }

[[rules]]
note = "bets into the preflop raiser more than anyone (more than 1 flop in 4)"
role = ["donk"]
scale = { aggressive = 9.787 }

[[rules]]
note = "bets 4 times in 10 when checked to on the turn"
role = ["free"]
scale = { aggressive = 1.233 }

[[rules]]
note = "a quarter of his called river bets are bluffs"
streets = ["river"]
facing = "none"
hands = ["weak", "air"]
scale = { aggressive = 0.651 }
