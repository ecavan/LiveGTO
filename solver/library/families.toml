oop_range = "88-22,A9s-A2s,KTs-K2s,QJs-Q2s,JTs-J2s,T9s-T2s,98s-92s,87s-82s,76s-72s,65s-62s,54s-52s,43s-42s,32s,AJo-A2o,KQo-K2o,QJo-Q2o,JTo-J2o,T9o-T2o,98o-92o,87o-82o,76o-72o,65o-62o,54o-52o,43o-42o,32o"
pot = 2.5
stack = 99.0
flops = ["Kd8s4h", "Ah6c2d", "Jc9c7s", "7d5d3h", "QhQs8c", "Ts4c2h"]
profiles = ["gto.toml", "station.toml", "nit.toml", "maniac.toml", "whale.toml"]
