[[family]]
id = "3bp_bb_btn"
name = "3-bet pot, BB vs BTN"
preflop = "BTN opens 5bb, BB 3-bets to 18bb, BTN calls"
oop_pos = "BB"
ip_pos = "BTN"
aggressor = "oop"
